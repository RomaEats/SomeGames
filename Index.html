<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --line: rgba(255, 255, 255, 0.18);
      --text: #f9fafb;
      --accent: #60a5fa;
      --paddle: #e5e7eb;
      --ball: #fbbf24;
      --score: #f9fafb;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #0f172a 0%, var(--bg) 52%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-shell {
      width: min(94vw, 900px);
    }

    .scoreboard {
      background: rgba(17, 24, 39, 0.9);
      border: 2px solid var(--line);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      padding: 12px 20px;
      text-align: center;
      font-size: clamp(1.2rem, 2.4vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, #0b1220 0%, #111827 100%);
      border: 2px solid var(--line);
      border-top: none;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      touch-action: none;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="scoreboard">
      <span id="leftScore">0</span> : <span id="rightScore">0</span>
    </div>
    <canvas id="gameCanvas" width="900" height="500" aria-label="Pong game"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const leftScoreEl = document.getElementById("leftScore");
    const rightScoreEl = document.getElementById("rightScore");

    const paddleHeight = 120;
    const paddleWidth = 14;
    const paddleOffset = 22;

    const leftPaddle = {
      x: paddleOffset,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 8
    };

    const rightPaddle = {
      x: canvas.width - paddleOffset - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 5.4
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 9,
      vx: 6,
      vy: 4
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    let mouseControlActive = false;
    let score = { left: 0, right: 0 };

    function updateScoreboard() {
      leftScoreEl.textContent = score.left;
      rightScoreEl.textContent = score.right;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = (Math.random() * 1.4 - 0.7); // -0.7 to 0.7 radians
      const speed = 6 + Math.random() * 1.5;

      ball.vx = direction * speed;
      ball.vy = angle * 6;
    }

    function moveLeftPaddleKeyboard() {
      if (keys.ArrowUp) {
        leftPaddle.y -= leftPaddle.speed;
      }
      if (keys.ArrowDown) {
        leftPaddle.y += leftPaddle.speed;
      }

      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);
    }

    function moveLeftPaddleByMouse(clientY) {
      const rect = canvas.getBoundingClientRect();
      const y = ((clientY - rect.top) / rect.height) * canvas.height;
      leftPaddle.y = clamp(y - leftPaddle.height / 2, 0, canvas.height - leftPaddle.height);
      mouseControlActive = true;
    }

    function trackTouchControls(event) {
      const touch = event.touches[0];
      if (!touch) return;
      moveLeftPaddleByMouse(touch.clientY);
    }

    function handleKeyboard(event) {
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        event.preventDefault();
        if (event.type === "keydown") {
          keys[event.key] = true;
        } else {
          keys[event.key] = false;
        }
      }
    }

    function handlePointerMove(event) {
      moveLeftPaddleByMouse(event.clientY);
    }

    function handlePointerLeave() {
      mouseControlActive = false;
    }

    function updateRightPaddle() {
      const targetY = ball.y - rightPaddle.height / 2;
      const direction = targetY > rightPaddle.y ? 1 : -1;
      const distance = Math.abs(targetY - rightPaddle.y);

      if (distance > 0) {
        rightPaddle.y += direction * rightPaddle.speed;
      }

      rightPaddle.y = clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);
    }

    function collidesWithPaddle(paddle, ballX, ballY) {
      return (
        ballX + ball.radius >= paddle.x &&
        ballX - ball.radius <= paddle.x + paddle.width &&
        ballY + ball.radius >= paddle.y &&
        ballY - ball.radius <= paddle.y + paddle.height
      );
    }

    function handlePaddleCollision(paddle, isLeft) {
      if (
        collidesWithPaddle(paddle, ball.x, ball.y) &&
        ((isLeft && ball.vx < 0) || (!isLeft && ball.vx > 0))
      ) {
        const relativeIntersectY = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
        const maxBounceAngle = Math.PI / 3; // 60 degrees
        const bounceAngle = relativeIntersectY * maxBounceAngle;

        const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.8, 12.5);

        ball.vx = Math.cos(bounceAngle) * speed;
        ball.vy = Math.sin(bounceAngle) * speed;

        if (isLeft) {
          ball.x = paddle.x + paddle.width + ball.radius + 0.1;
          ball.vx = Math.abs(ball.vx);
        } else {
          ball.x = paddle.x - ball.radius - 0.1;
          ball.vx = -Math.abs(ball.vx);
        }
      }
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top and bottom wall collisions
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
      } else if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
      }

      // Left wall (right player scores)
      if (ball.x - ball.radius <= 0) {
        score.right += 1;
        updateScoreboard();
        resetBall(1);
      }

      // Right wall (left player scores)
      if (ball.x + ball.radius >= canvas.width) {
        score.left += 1;
        updateScoreboard();
        resetBall(-1);
      }

      // Paddle collisions
      handlePaddleCollision(leftPaddle, true);
      handlePaddleCollision(rightPaddle, false);
    }

    function drawNet() {
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(paddle) {
      ctx.fillStyle = "#f3f4f6";
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.fillStyle = "#fbbf24";
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawNet();
      drawPaddle(leftPaddle);
      drawPaddle(rightPaddle);
      drawBall();
    }

    function update() {
      if (keys.ArrowUp || keys.ArrowDown) {
        moveLeftPaddleKeyboard();
      } else if (mouseControlActive) {
        // If mouse/touch is actively controlling, keep it synced.
        // The pointer move handler already moves the paddle.
      }

      updateRightPaddle();
      updateBall();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Keyboard controls
    window.addEventListener("keydown", handleKeyboard);
    window.addEventListener("keyup", handleKeyboard);

    // Mouse control for left paddle
    canvas.addEventListener("pointerdown", (event) => {
      mouseControlActive = true;
      handlePointerMove(event);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (event.pointerType === "mouse" || event.pointerType === "touch") {
        mouseControlActive = true;
        handlePointerMove(event);
      }
    });
    canvas.addEventListener("pointerleave", handlePointerLeave);

    // Touch support: move paddle with finger
    canvas.addEventListener("touchstart", (event) => {
      event.preventDefault();
      trackTouchControls(event);
    }, { passive: false });

    canvas.addEventListener("touchmove", (event) => {
      event.preventDefault();
      trackTouchControls(event);
    }, { passive: false });

    canvas.addEventListener("touchend", () => {
      mouseControlActive = false;
    });

    updateScoreboard();
    resetBall(Math.random() < 0.5 ? -1 : 1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
  </html>
